allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  # The dice-box postinstall (copyAssets.js) is an interactive prompt that
  # copies dist/assets into ./public/assets — unnecessary here: the published
  # tarball already ships dist/assets and the theme assets are vendored
  # separately via `pnpm assets:dice-box` (scripts/assets/copy-dice-box.ts).
  "@3d-dice/dice-box": false
