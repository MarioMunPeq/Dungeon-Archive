<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="%BASE_URL%icons/icon-256.png" />
    <link rel="icon" type="image/png" sizes="384x384" href="%BASE_URL%icons/icon-384.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icons/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dungeon Archive" />
    <meta name="description" content="Offline-first companion app for D&D 5e tabletop sessions" />
    <meta
      property="og:title"
      content="Dungeon Archive — a mobile-first D&D companion for players"
    />
    <meta
      property="og:description"
      content="Offline-first cheat sheet for D&D 5e: rules, spells, monsters, and combat tracking — built for players, not DMs."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://MarioMunPeq.github.io/Dungeon-Archive/" />
    <meta property="og:site_name" content="Dungeon Archive" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Dungeon Archive — a mobile-first D&D companion for players"
    />
    <meta
      name="twitter:description"
      content="Offline-first cheat sheet for D&D 5e: rules, spells, monsters, and combat tracking — built for players, not DMs."
    />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>Dungeon Archive</title>
    <script>
      (function () {
        var RETRY_KEY = "dungeon-archive:boot-retry-attempted";

        function isModuleLoadFailure(e) {
          if (e.type !== "error") return false;
          if (typeof ErrorEvent !== "undefined" && e instanceof ErrorEvent) return false;
          var t = e.target;
          return !!t && t.tagName === "SCRIPT" && t.type === "module" && !!t.src;
        }

        function showBootError(url) {
          var boot = document.getElementById("boot");
          if (!boot) return;
          boot.innerHTML =
            '<span class="brand">Dungeon Archive</span>' +
            '<span class="caption" style="max-width:30ch;text-align:center">' +
            "Failed to load the application. The app shell is outdated and a required file could not be loaded." +
            "</span>" +
            '<span class="caption" style="color:#f87171;word-break:break-all;max-width:36ch;text-align:center">' +
            (url || "unknown file") +
            "</span>" +
            '<span class="caption" style="max-width:30ch;text-align:center">Please hard-refresh the page (Ctrl+Shift+R).</span>';
        }

        window.addEventListener(
          "error",
          function (e) {
            if (!isModuleLoadFailure(e)) return;
            if (document.getElementById("boot") === null) return;

            var src = e.target.src;
            var attempted = false;
            try {
              attempted = sessionStorage.getItem(RETRY_KEY) === "1";
            } catch (_) {}

            if (!attempted) {
              try {
                sessionStorage.setItem(RETRY_KEY, "1");
              } catch (_) {}
              var loc = window.location;
              var base = loc.pathname + loc.search;
              var sep = base.indexOf("?") === -1 ? "?" : "&";
              window.location.replace(base + sep + "bootRetry=1");
              return;
            }

            showBootError(src);
          },
          true,
        );

        if (typeof MutationObserver !== "undefined") {
          try {
            var observer = new MutationObserver(function () {
              if (document.getElementById("boot") === null) {
                try {
                  sessionStorage.removeItem(RETRY_KEY);
                } catch (_) {}
                observer.disconnect();
              }
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
          } catch (_) {}
        }
      })();
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #12100e;
        color: #f5f1ec;
        font-family:
          "Inter Variable",
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      #boot .brand {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #boot .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #26221e;
        border-top-color: #d97b29;
        border-radius: 9999px;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .caption {
        font-size: 12px;
        color: #a39c93;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span class="brand">Dungeon Archive</span>
        <span class="spinner" aria-hidden="true"></span>
        <span class="caption">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
